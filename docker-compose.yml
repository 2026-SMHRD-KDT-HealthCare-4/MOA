version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: moa-fastapi-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_BASE_URL=https://www.moa0.site
    container_name: moa-expo-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
