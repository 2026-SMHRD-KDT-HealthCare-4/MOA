server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; # Expo Router 등 클라이언트 라우팅 404 방지
    }

    # index.html 은 절대 캐시하지 않는다(항상 최신). 파일명이 해시되지 않는 진입점이라,
    # 캐시되면 새 배포(새 해시의 JS 번들)를 못 받아 팀원들이 옛 화면을 계속 보는 문제가 생긴다.
    # (해시 붙은 JS/CSS는 아래에서 1년 캐시 유지 — 최신성과 성능 둘 다 확보)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # favicon.ico 는 파일명이 해시되지 않으므로 매번 재검증해 아이콘 교체가 바로 반영되게 한다.
    location = /favicon.ico {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 정적 리소스 캐싱 정책
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
