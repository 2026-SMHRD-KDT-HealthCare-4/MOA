server {
    listen 80;
    server_name localhost www.moa0.site;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.moa0.site;

    ssl_certificate /etc/letsencrypt/live/www.moa0.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.moa0.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location ~ ^/(auth|chat|speech|analyze|record|report|hospital|medication|notification|places)(/|$) {
        proxy_pass http://10.0.2.6:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; # Expo Router 등 클라이언트 라우팅 404 방지
    }

    # index.html 은 절대 캐시하지 않는다(항상 최신). 파일명이 해시되지 않는 진입점이라,
    # 캐시되면 새 배포(새 해시의 JS 번들)를 못 받아 팀원들이 옛 화면을 계속 보는 문제가 생긴다.
    # (해시 붙은 JS/CSS는 아래에서 1년 캐시 유지 — 최신성과 성능 둘 다 확보)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # favicon.ico 는 파일명이 해시되지 않으므로 매번 재검증해 아이콘 교체가 바로 반영되게 한다.
    location = /favicon.ico {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 정적 리소스 캐싱 정책
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
